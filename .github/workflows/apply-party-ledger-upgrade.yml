name: Apply party ledger UX upgrade

on:
  push:
    branches:
      - feat/party-ledgers-wasooli-darkmode
    paths:
      - .github/scripts/apply_party_ledger_upgrade.py
      - .github/workflows/apply-party-ledger-upgrade.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/party-ledgers-wasooli-darkmode
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Ledger-Pro-PK-Vercel-v2/package-lock.json
      - name: Apply scoped integration
        run: python .github/scripts/apply_party_ledger_upgrade.py
      - name: Install dependencies
        working-directory: Ledger-Pro-PK-Vercel-v2
        run: npm ci
      - name: Run tests and production build
        working-directory: Ledger-Pro-PK-Vercel-v2
        run: npm run build
      - name: Commit validated changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "ledger-pro-ci"
          git config user.email "ledger-pro-ci@users.noreply.github.com"
          git add Ledger-Pro-PK-Vercel-v2/app/ledger-app.tsx Ledger-Pro-PK-Vercel-v2/app/pro-transaction-modal.tsx Ledger-Pro-PK-Vercel-v2/app/pro-accounting.css
          git commit -m "feat: wire party ledgers wasooli and dark mode fixes"
          git push origin HEAD:feat/party-ledgers-wasooli-darkmode
