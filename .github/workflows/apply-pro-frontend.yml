name: Apply professional frontend integration

on:
  push:
    branches:
      - feat/pro-accounting-auto-calculations
    paths:
      - .github/workflows/apply-pro-frontend.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pro-accounting-auto-calculations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Ledger-Pro-PK-Vercel-v2/package-lock.json
      - name: Apply scoped page integration
        run: python .github/scripts/apply_pro_frontend.py
      - name: Install dependencies
        working-directory: Ledger-Pro-PK-Vercel-v2
        run: npm ci
      - name: Test and build
        working-directory: Ledger-Pro-PK-Vercel-v2
        run: npm run build
      - name: Commit validated integration
        run: |
          git config user.name "ledger-pro-ci"
          git config user.email "ledger-pro-ci@users.noreply.github.com"
          git add Ledger-Pro-PK-Vercel-v2/app/page.tsx
          if git diff --cached --quiet; then
            echo "No page changes to commit"
            exit 0
          fi
          git commit -m "feat: wire professional auto calculations into app"
          git push origin HEAD:feat/pro-accounting-auto-calculations
